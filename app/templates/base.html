<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#00703c">
    <title>{% block title %}{% endblock %} – Secure Fault Reporting and Resolution System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/application.css') }}">
</head>
<body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>
    <a href="#main-content" class="govuk-skip-link" data-module="govuk-skip-link">Skip to main content</a>

    <header class="app-generic-header" role="banner">
        <div class="govuk-width-container">
            <a class="app-generic-header__link" href="{{ url_for('index') }}">
                <svg class="app-generic-header__logo" width="28" height="30" viewBox="0 0 28 30" fill="currentColor" aria-hidden="true" focusable="false">
                    <circle cx="13.5549" cy="4.21349" r="4.21349" />
                    <circle cx="13.5549" cy="25.7865" r="4.21349" />
                    <circle cx="22.8963" cy="9.6068" r="4.21349" />
                    <circle cx="4.2135" cy="20.3932" r="4.21349" />
                    <circle cx="22.8963" cy="20.3932" r="4.21349" />
                    <circle cx="4.21351" cy="9.60674" r="4.21349" />
                </svg>
                Secure Fault Reporting and Resolution System
            </a>
        </div>
    </header>

    {% if current_user.is_authenticated %}
    <div class="app-account-bar">
        <div class="govuk-width-container">
            <span class="govuk-body-s">Signed in as <strong>{{ current_user.username }}</strong></span>
            <a class="govuk-link govuk-body-s govuk-!-margin-left-3" href="{{ url_for('logout') }}">Sign out</a>
        </div>
    </div>
    {% endif %}

    <main class="govuk-main-wrapper" id="main-content">
        <div class="govuk-width-container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="app-footer">
        <div class="govuk-width-container">
            <p class="govuk-body-s govuk-!-margin-bottom-0">Level 6 Software Engineering and DevOps project</p>
        </div>
    </footer>

    <script type="module">
        import { initAll } from "{{ url_for('static', filename='js/govuk-frontend.min.js') }}";
        initAll();
    </script>
</body>
</html>
